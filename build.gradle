// MPV 模块必须与宿主的 Java/JNI、FFmpeg 和 C++ 库配套，构建时固定原始 AAR 指纹。
ext.mpvRuntimeId = ['lib-mpvplayer-release.aar', 'lib-decoder-ffmpeg-release.aar'].collect { name ->
    java.security.MessageDigest.getInstance('SHA-256').digest(file("engine/core/libs/${name}").bytes).encodeHex().toString()
}.join(':')

// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:9.3.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.chaquo.python:gradle:17.2.0"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content { includeGroupByRegex 'com\\.github\\..*' }
        }
    }
}

subprojects {
    plugins.withId('com.android.application') { android.buildToolsVersion = '37.0.0' }
    plugins.withId('com.android.library') { android.buildToolsVersion = '37.0.0' }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

/**
 * Builds the Spider SDK jar that third-party source authors compile against.
 *
 *   ./gradlew apiJar   ->   build/outputs/api/catvod-api.jar
 *
 * Only the documented SDK surface is packaged. Application internals (UI, loaders, players) stay
 * out so a source jar cannot depend on classes the App may change. API classes are compileOnly in
 * the runtime, so unresolved references are filtered out rather than failing the archive.
 */
ext.apiJarPackages = ['com/github/catvod/net', 'com/github/catvod/utils', 'com/github/catvod/bean', 'com/github/catvod/crawler']

ext.apiJarRootClasses = ['Runtime', 'Proxy', 'Init', 'Local']

tasks.register('apiJar', Jar) {
    group = 'build'
    description = '打包爬虫 SDK（catvod-api.jar），供第三方源作者 compileOnly 依赖'
    dependsOn ':source-runtime:compileDebugJavaWithJavac'

    archiveBaseName = 'catvod-api'
    archiveVersion = ''
    destinationDirectory = layout.buildDirectory.dir('outputs/api')

    // 直接从字节码目录取文件，includes 则对内部类也一致生效
    def classesDir = project(':source-runtime').layout.buildDirectory
            .dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')

    from(classesDir) {
        rootProject.ext.apiJarPackages.each { pkg -> include pkg + '/**' }
        rootProject.ext.apiJarRootClasses.each { name ->
            include 'com/github/catvod/' + name + '.class'
            include 'com/github/catvod/' + name + '$*.class'
        }
    }

    preserveFileTimestamps = false
    reproducibleFileOrder = true

    doLast {
        def output = archiveFile.get().asFile
        logger.lifecycle("catvod-api.jar -> ${output} (${output.length()} bytes)")
    }
}
