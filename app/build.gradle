apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

configurations.configureEach {
    exclude group: 'io.antmedia', module: 'rtmp-client'
    exclude group: 'xpp3', module: 'xpp3_min'
    exclude group: 'xpp3', module: 'xpp3'
}

def tvBoxSigningStore = rootProject.file('TVBoxOSC.jks')
def tvBoxKeyAlias = System.getenv('TVBOX_KEY_ALIAS') ?: 'TVBoxOSC'
def tvBoxKeyPassword = System.getenv('TVBOX_KEY_PASSWORD') ?: 'TVBoxOSC'
def tvBoxStorePassword = System.getenv('TVBOX_STORE_PASSWORD') ?: 'TVBoxOSC'

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    doLast {
        if (!tvBoxSigningStore.exists()) {
            throw new GradleException('Release requires TVBoxOSC.jks and the fixed TVBOX signing credentials. Use assembleDebug for local development.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn(verifyReleaseSigning)
}

android {
    namespace 'com.kukuqi.tvbox.osc'
    compileSdkVersion 37
    ndkVersion '29.0.14206865'
    ["python", "quickjs", "thunder", "nodejs", "bdj", "mpv"].each { sourceSets.main.res.srcDir(rootProject.file("runtime/icons/${it}")) }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    defaultConfig {
        applicationId 'com.kukuqi.tvbox.osc'
        manifestPlaceholders.tvboxAppLabel = '@string/app_name'
        minSdkVersion 24
        targetSdkVersion 34
        buildConfigField 'String', 'RUNTIME_CATALOG_URL', groovy.json.JsonOutput.toJson(providers.gradleProperty('runtimeCatalogUrl').getOrElse('https://github.com/kukuqi666/TVboxOSC/releases/latest/download/catalog.json'))
        versionCode 312
        versionName '3.1.2'
        // -PupdateFixture=true 时产出 versionCode 313 / versionName 3.1.3 的升级验证包，
        // 供 UpdateResumeRegressionTest 校验"版本更高且签名一致"的升级链路。
        if (providers.gradleProperty("updateFixture").getOrElse("false").toBoolean()) {
            versionCode 313
            versionName '3.1.3'
        }
        testInstrumentationRunner 'com.kukuqi.tvbox.osc.RegressionTestRunner'
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        ndk {
            //abiFilters "armeabi-v7a"//, ""
            abiFilters "arm64-v8a"
        }

    }


    // 执行配置
    applicationVariants.all { variant ->

        // Apk 输出配置
        variant.outputs.all { output ->
            outputFileName = 'TVboxOSC-v' + variant.versionName + '.apk'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // Compress native libraries in the APK; Android extracts them at install time.
        jniLibs {
            useLegacyPackaging true
            // MPV 原生库按需安装；Exo 使用的 FFmpeg 与共享 C++ 库继续保留在主包。
            excludes += ['**/libmpv.so', '**/libplayer.so']
        }
    }

    signingConfigs {
        config {
            if (tvBoxSigningStore.exists()) {
                keyAlias tvBoxKeyAlias
                keyPassword tvBoxKeyPassword
                storeFile tvBoxSigningStore
                storePassword tvBoxStorePassword
            }
        }
    }

    buildTypes {
        debug {
            if (providers.gradleProperty('shrinkValidation').getOrElse('false').toBoolean()) {
                debuggable false
                minifyEnabled true
                shrinkResources true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-core.pro'
            }
            if (providers.gradleProperty('coreValidation').getOrElse('false').toBoolean()) {
                applicationIdSuffix '.corevalidation'
                manifestPlaceholders.tvboxAppLabel = 'TVboxOSC 验证版'
            }
            if (tvBoxSigningStore.exists()) {
                signingConfig signingConfigs.config
            }
        }

        release {
            if (tvBoxSigningStore.exists()) {
                signingConfig signingConfigs.config
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-core.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packagingOptions {//引入dlna-cast时的文件冲突
        exclude 'META-INF/beans.xml'
    }
}

def generatedNotes = layout.buildDirectory.dir('generated/releaseNotes')
android.sourceSets.main.assets.srcDir(generatedNotes.get().asFile)
def generateReleaseNotes = tasks.register('generateReleaseNotes') {
    def notesSource = rootProject.file('README.md')
    inputs.property('versionName', android.defaultConfig.versionName)
    inputs.files(notesSource)
    outputs.dir(generatedNotes)
    doLast {
        def directory = generatedNotes.get().asFile
        directory.mkdirs()
        def entry = notesSource.exists() ? notesSource.readLines('UTF-8').find { line ->
            line.contains("TVboxOSC v${android.defaultConfig.versionName}：")
        } : null
        def notes = entry ? "TVboxOSC ${android.defaultConfig.versionName}\n\n${entry.replaceFirst('^>\\*\\s*', '')}" : "TVboxOSC ${android.defaultConfig.versionName}\n功能改进与问题修复。详细记录可通过项目地址查看。"
        new File(directory, 'release-notes.txt').setText(notes.replaceAll('(?m)^#+ ', '').replace('**', '').replace('`', ''), 'UTF-8')
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) task.dependsOn(generateReleaseNotes)
}

