rootProject.name = "TVBoxMobile"
include ':app'
include ':player'
include ':TabLayout'
include ':ViewPager1Delegate'
include ':crash'
// 本地组件：保留模块标识，集中维护播放器适配、崩溃页与分页控件。
project(':player').projectDir = file('components/player')
project(':crash').projectDir = file('components/crash')
project(':TabLayout').projectDir = file('components/tablayout')
project(':ViewPager1Delegate').projectDir = file('components/viewpager')
include ':tvbox-engine', ':source-runtime', ':python-runtime'
project(':tvbox-engine').projectDir = file('engine/core')
project(':source-runtime').projectDir = file('engine/catvod')
project(':python-runtime').projectDir = file('engine/chaquo')

include ':runtime-python'
project(':runtime-python').projectDir = file('runtime/python')

include ':runtime-quickjs'
project(':runtime-quickjs').projectDir = file('runtime/quickjs')

include ':runtime-thunder'
project(':runtime-thunder').projectDir = file('runtime/thunder')
include ':runtime-nodejs', ':runtime-bdj'
project(':runtime-nodejs').projectDir = file('runtime/nodejs')
project(':runtime-bdj').projectDir = file('runtime/bdj')
